<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GSAP Explode Demo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
#gsap-panel {
  position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
  background: rgba(13,13,26,0.85); backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.05); border-radius: 8px;
  padding: 5px 8px; min-width: 260px;
  display: flex; flex-direction: column; gap: 3px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.35);
  font-family: 'Segoe UI', system-ui, sans-serif; color: #ccc;
}
#gsap-panel .ctrl-row { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
#gsap-panel label { font-size: 11px; color: #888; white-space: nowrap; }
#gsap-panel .value { font-size: 11px; color: #88cc44; font-weight: 600; min-width: 24px; text-align: right; font-variant-numeric: tabular-nums; }
#gsap-panel .btn-icon { width: 24px; height: 24px; border-radius: 5px; border: none; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; }
#gsap-panel .btn-play { background: #88cc44; color: #0d0d1a; }
#gsap-panel .btn-play.paused { background: #ff8844; }
#gsap-panel .btn-icon.secondary { background: rgba(255,255,255,0.08); color: #ccc; }
#gsap-panel .scrub-wrap { display: flex; align-items: center; gap: 4px; flex: 1; }
#gsap-panel .scrub-wrap input[type="range"] { max-width: none; }
#gsap-panel .time-label { font-size: 11px; color: #888; min-width: 65px; text-align: right; font-variant-numeric: tabular-nums; }
#gsap-panel input[type="range"] { flex: 1; min-width: 40px; height: 3px; -webkit-appearance: none; appearance: none; background: rgba(255,255,255,0.12); border-radius: 2px; outline: none; cursor: pointer; }
#gsap-panel input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: #88cc44; cursor: pointer; border: 2px solid #0d0d1a; }
#gsap-panel .ctrl-select { padding: 2px 4px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06); color: #ccc; font-size: 11px; outline: none; cursor: pointer; max-width: 56px; }
#gsap-panel .ctrl-select:focus { border-color: #88cc44; }
#status-msg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #666; font-family: 'Segoe UI', sans-serif; font-size: 14px; text-align: center; }
</style>
</head>
<body>

<div id="status-msg">Waiting for viewer API...<br><small>Load this as an overlay in the 3D viewer.</small></div>

<div id="gsap-panel" style="display:none">
  <div class="ctrl-row">
    <button class="btn-icon btn-play" id="e-btn-play" title="播放 (Space)">▶</button>
    <button class="btn-icon secondary" id="e-btn-reset" title="重置 (R)">⟲</button>
    <div class="scrub-wrap">
      <input type="range" id="e-scrub" min="0" max="1000" value="0">
      <span class="time-label" id="e-time-label">0.00s / 0.00s</span>
    </div>
    <label>轴</label>
    <select class="ctrl-select" id="e-axis" style="max-width:40px">
      <option value="x">X</option>
      <option value="y">Y</option>
      <option value="z" selected>Z</option>
    </select>
    <label>运动</label>
    <select class="ctrl-select" id="e-easing">
      <option value="back.out(1.7)">微回弹</option>
      <option value="back.out(2.5)">强回弹</option>
      <option value="elastic.out(1,0.2)">弹簧震荡</option>
      <option value="bounce.out">弹跳</option>
      <option value="power3.out" selected>平滑缓出</option>
      <option value="expo.out">指数缓出</option>
      <option value="none">线性</option>
    </select>
  </div>
  <div class="ctrl-row">
    <label>时长</label>
    <input type="range" id="e-dur" min="0.3" max="5" step="0.1" value="1.5">
    <span class="value" id="e-dur-val">1.5s</span>
    <label>扩散</label>
    <input type="range" id="e-spread" min="1" max="6" step="0.1" value="2">
    <span class="value" id="e-spread-val">2.0×</span>
    <label><input type="checkbox" id="e-strict" checked> 严格</label>
  </div>
</div>

<script>
(function() {
  var gsap, THREE, api

  function tryInit() {
    if (window.parent === window) return false
    gsap = window.parent.__gsap
    THREE = window.parent.__THREE
    api = window.parent.__viewerAPI || window.parent.viewerAPI
    if (!gsap || !THREE || !api) return false
    if (!api.getPartProxy('__model__')) {
      document.getElementById('status-msg').innerHTML = 'No model loaded.<br><small>Load a 3D model in the viewer first.</small>'
      return false
    }
    document.getElementById('status-msg').style.display = 'none'
    document.getElementById('gsap-panel').style.display = ''
    startDemo()
    return true
  }

  if (!tryInit()) {
    var t = setInterval(function() { if (tryInit()) clearInterval(t) }, 500)
  }

  function startDemo() {
    var parts = [], timeline = null, isPlaying = false

    function resetPartsPosition() {
      var saved = window.__gsap_initial_positions
      if (saved) {
        var all = api.getParts()
        for (var i = 0; i < all.length; i++) {
          var s = saved[all[i].partId]
          if (s) { var p = api.getPartProxy(all[i].partId); if (p) p.position.set(s[0], s[1], s[2]) }
        }
      } else {
        window.__gsap_initial_positions = {}
        var all = api.getParts()
        for (var i = 0; i < all.length; i++) {
          var p = api.getPartProxy(all[i].partId)
          if (p) window.__gsap_initial_positions[all[i].partId] = [p.position.x, p.position.y, p.position.z]
        }
      }
    }

    function findMeshByPartId(partId) {
      var scene = window.parent.__r3f_dev && window.parent.__r3f_dev.scene
      if (!scene) return null
      var found = null
      scene.traverse(function(child) { if (!found && child.isMesh && child.userData && child.userData.partId === partId) found = child })
      return found
    }

    function buildExplode() {
      resetPartsPosition()
      if (timeline) { timeline.progress(0).kill(); timeline = null }
      isPlaying = false
      var btnPlay = document.getElementById('e-btn-play')
      btnPlay.textContent = '▶'; btnPlay.classList.remove('paused')
      var partInfos = api.getParts()
      if (!partInfos || !partInfos.length) return
      var localPositions = [], partIds = []
      for (var i = 0; i < partInfos.length; i++) {
        var info = partInfos[i], proxy = api.getPartProxy(info.partId)
        if (!proxy) continue
        localPositions.push(proxy.position.clone()); partIds.push(info.partId)
      }
      if (!partIds.length) return
      computeTargets(partIds, localPositions, partInfos)
      buildTimeline()
    }

    function computeTargets(partIds, localPositions, partInfos) {
      var axis = document.getElementById('e-axis').value
      var multiplier = parseFloat(document.getElementById('e-spread').value)
      var worldPositions = []
      for (var i = 0; i < partInfos.length; i++) {
        var mesh = findMeshByPartId(partInfos[i].partId)
        if (mesh) { var box = new THREE.Box3().setFromObject(mesh); worldPositions.push(box.getCenter(new THREE.Vector3())) }
        else { worldPositions.push(localPositions[i].clone()) }
      }
      var indexed = []
      for (var i = 0; i < partIds.length; i++) indexed.push({ idx: i, wVal: worldPositions[i][axis] })
      indexed.sort(function(a, b) { return a.wVal - b.wVal })
      var N = indexed.length, worldMin = indexed[0].wVal, worldMax = indexed[N - 1].wVal, worldRange = worldMax - worldMin, worldCenter = (worldMin + worldMax) / 2
      var modelBox = new THREE.Box3()
      for (var i = 0; i < partInfos.length; i++) { var mesh = findMeshByPartId(partInfos[i].partId); if (mesh) modelBox.union(new THREE.Box3().setFromObject(mesh)) }
      var modelDiagonal = Math.max(modelBox.getSize(new THREE.Vector3()).x, modelBox.getSize(new THREE.Vector3()).y, modelBox.getSize(new THREE.Vector3()).z) || 1
      var strictSep = document.getElementById('e-strict').checked
      parts = []
      for (var si = 0; si < N; si++) {
        var k = indexed[si].idx, lPos = localPositions[k], target = lPos.clone()
        if (strictSep) { var norm = (si / (N - 1 || 1)) * 2 - 1; target[axis] = lPos[axis] + norm * modelDiagonal * Math.max(0, multiplier - 1) * 0.5 }
        else if (worldRange < 0.001) { target[axis] = lPos[axis] + ((si / (N - 1 || 1)) - 0.5) * modelDiagonal * Math.max(0, multiplier - 1) }
        else { target[axis] = lPos[axis] + (worldPositions[k][axis] - worldCenter) * Math.max(0, multiplier - 1) }
        parts.push({ partId: partIds[k], proxy: api.getPartProxy(partIds[k]), localPos: lPos, target: target, name: partInfos[k].name })
      }
    }

    function buildTimeline() {
      if (!parts.length) return
      if (timeline) { timeline.progress(0).kill(); timeline = null }
      var btnPlay = document.getElementById('e-btn-play')
      var easing = document.getElementById('e-easing').value
      var duration = parseFloat(document.getElementById('e-dur').value)
      timeline = gsap.timeline({ paused: true, onUpdate: syncUI, onComplete: function() { isPlaying = false; btnPlay.textContent = '⟳'; btnPlay.classList.remove('paused') }, onReverseComplete: function() { isPlaying = false; btnPlay.textContent = '▶'; btnPlay.classList.remove('paused'); syncUI() } })
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i]
        if (!p.proxy || !p.proxy.position || typeof p.proxy.position.x !== 'number') continue
        timeline.fromTo(p.proxy.position, { x: p.localPos.x, y: p.localPos.y, z: p.localPos.z }, { x: p.target.x, y: p.target.y, z: p.target.z, duration: duration, ease: easing, overwrite: true }, 0)
      }
      syncUI()
    }

    function togglePlay() {
      if (!timeline || !parts.length) return
      var btnPlay = document.getElementById('e-btn-play')
      if (isPlaying) { timeline.pause(); isPlaying = false; btnPlay.textContent = '▶'; btnPlay.classList.remove('paused') }
      else { if (timeline.progress() >= 1) timeline.progress(0); timeline.play(); isPlaying = true; btnPlay.textContent = '⏸'; btnPlay.classList.add('paused') }
    }

    function resetAnim() {
      if (!timeline) return
      if (timeline.progress() === 0) return
      isPlaying = true; document.getElementById('e-btn-play').textContent = '⏸'; document.getElementById('e-btn-play').classList.add('paused')
      timeline.reverse()
    }

    function syncUI() {
      var scrub = document.getElementById('e-scrub'), timeLabel = document.getElementById('e-time-label')
      if (!timeline) { scrub.value = 0; timeLabel.textContent = '0.00s / 0.00s'; return }
      var p = timeline.progress()
      scrub.value = p * 1000
      timeLabel.textContent = (p * timeline.duration()).toFixed(2) + 's / ' + timeline.duration().toFixed(2) + 's'
    }

    document.getElementById('e-btn-play').addEventListener('click', togglePlay)
    document.getElementById('e-btn-reset').addEventListener('click', resetAnim)
    document.getElementById('e-scrub').addEventListener('input', function() { if (!timeline) return; timeline.progress(this.value / 1000).pause(); isPlaying = false; document.getElementById('e-btn-play').textContent = '▶'; document.getElementById('e-btn-play').classList.remove('paused'); syncUI() })
    document.getElementById('e-axis').addEventListener('change', buildExplode)
    document.getElementById('e-easing').addEventListener('change', buildTimeline)
    document.getElementById('e-dur').addEventListener('input', function() { document.getElementById('e-dur-val').textContent = parseFloat(this.value).toFixed(1) + 's' })
    document.getElementById('e-dur').addEventListener('change', buildTimeline)
    document.getElementById('e-spread').addEventListener('input', function() { document.getElementById('e-spread-val').textContent = parseFloat(this.value).toFixed(1) + '×' })
    document.getElementById('e-spread').addEventListener('change', buildExplode)
    document.getElementById('e-strict').addEventListener('change', buildExplode)
    document.addEventListener('keydown', function(e) {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return
      if (e.key === ' ') { e.preventDefault(); togglePlay() }
      if (e.key === 'r') resetAnim()
    })
    buildExplode()
    console.log('[gsap-explode] ready')
  }
})()
</script>
</body>
</html>
